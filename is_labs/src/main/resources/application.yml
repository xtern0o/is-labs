server:
  port: 55080

jwt:
  secret: ${JWT_SECRET}
  access-ttl-seconds: 900
  refresh-ttl-seconds: 604800

app:
  s3:
    imports-bucket: ${S3_BUCKET:imports}

spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studs}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: is-labs-pool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000  # 3sec
      idle-timeout: 300000      # 5min
      max-lifetime: 300000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
      cache:
        region.factory_class: infinispan
        use_second_level_cache: true
        # конфиг для 1 экземпляра приложения
        infinispan.cfg: org/infinispan/hibernate/cache/commons/builder/infinispan-configs-local.xml
      generate_statistics: true # для проверки работы кэшей
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    jakarta:
      persistence:
        sharedCache:
          mode: ENABLE_SELECTIVE # кэшироуем только помеченные сущности
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        endpoint: ${S3_ENDPOINT}
        region: us-east-1
        path-style-access-enabled: true
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
